# Argo Rollouts progressive delivery: automated metric-driven canary
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-gateway-rollout
  namespace: payments-prod
  labels:
    app.kubernetes.io/name: payment-gateway
spec:
  replicas: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-gateway
  strategy:
    canary:
      canaryService: payment-gateway-canary
      stableService: payment-gateway-stable
      trafficRouting:
        nginx:
          stableIngress: payment-gateway-ingress
      steps:
        # Initial canary split and soak window
        - setWeight: 20
        - pause: { duration: 2m }
        - analysis:
            templates:
              - templateName: success-rate-analysis
            args:
              - name: service-name
                value: payment-gateway-canary
        # Mid-stage promotion
        - setWeight: 50
        - pause: { duration: 3m }
        - analysis:
            templates:
              - templateName: success-rate-analysis
            args:
              - name: service-name
                value: payment-gateway-canary
        # Final cutover
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-gateway
    spec:
      containers:
        - name: payment-gateway
          image: ghcr.io/qadeeraay/payment-gateway:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
