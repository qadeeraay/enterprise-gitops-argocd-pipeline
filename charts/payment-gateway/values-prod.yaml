# Production Environment Overrides
replicaCount: 3

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  hosts:
    - host: payments.company.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: payment-gateway-prod-tls
      hosts:
        - payments.company.com

env:
  APP_ENV: "production"
  APP_VERSION: "1.2.0"
